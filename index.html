<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KCar 모빌리티플랫폼 e-biz실 데이터랩</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-void: #050811;
      --kcar-red: #e52528;
      --cyan: #38bdf8;
      --violet: #818cf8;
      --font-sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-void);
      background-image:
        radial-gradient(ellipse 75% 50% at 20% 0%, rgba(56, 189, 248, 0.14), transparent 55%),
        radial-gradient(ellipse 65% 45% at 85% 15%, rgba(229, 37, 40, 0.14), transparent 50%),
        radial-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 28px 28px;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all;
    }

    body.auto-unlocking .gate-card {
      opacity: 0;
      pointer-events: none;
    }

    .gate-card {
      width: 100%;
      max-width: 420px;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.94), rgba(8, 13, 25, 0.97));
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.72), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      padding: 38px 32px 30px;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s ease;
    }

    .gate-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--kcar-red), var(--cyan), var(--violet));
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .brand-mark {
      background: #ffffff;
      padding: 6px 12px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark img {
      height: 28px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .brand-kicker {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.13em;
      color: var(--cyan);
      text-transform: uppercase;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #f8fafc;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .gate-heading {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .gate-desc {
      font-size: 13.5px;
      color: #94a3b8;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .pw-input {
      width: 100%;
      padding: 14px 46px 14px 16px;
      border-radius: 13px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(5, 8, 17, 0.85);
      color: #f8fafc;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .pw-input::placeholder {
      letter-spacing: -0.01em;
      font-weight: 500;
      color: #64748b;
    }

    .pw-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.16);
    }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 6px;
      line-height: 1;
    }

    .submit-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, var(--kcar-red), #b91c1c);
      color: #fff;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(229, 37, 40, 0.34);
      transition: transform 0.16s ease, opacity 0.16s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: default;
    }

    .err-msg {
      min-height: 20px;
      margin-top: 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: #f87171;
      text-align: center;
    }

    .gate-footer {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
    }

    .gate-sig {
      font-weight: 800;
      color: #cbd5e1;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-7px); }
      40%, 80% { transform: translateX(7px); }
    }

    .shake {
      animation: shake 0.34s ease;
    }
  </style>
</head>
<body class="auto-unlocking">
  <main class="gate-card" id="gateCard">
    <div class="brand-row">
      <div class="brand-mark">
        <img src="./assets/images/company-ci.png" alt="CI 로고" />
      </div>
      <div>
        <div class="brand-kicker">Mobility Platform Intelligence</div>
        <div class="brand-title">KCar 모빌리티플랫폼 e-biz실 데이터랩</div>
      </div>

    <div class="lock-badge">🔒 PROTECTED ACCESS · AES-256</div>
    <h1 class="gate-heading">보안 인증이 필요합니다</h1>

    <form id="unlockForm" autocomplete="off">
      <div class="input-wrap">
        <input
          type="password"
          id="pwInput"
          class="pw-input"

          autocorrect="off"
          spellcheck="false"
          required
        />
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="비밀번호 표시 전환">👁</button>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">잠금 해제 →</button>
      <div class="err-msg" id="errMsg" role="alert"></div>
    </form>

    <div class="gate-footer">
      <span>Encrypted DataLab Gate</span>
      <span>Curated by <strong class="gate-sig">Ji-Su, Kim</strong></span>
    </div>
  </main>

          ['verify']
        );

        const msg = new Uint8Array(ivBytes.length + ctBytes.length);
        msg.set(ivBytes, 0);
        msg.set(ctBytes, ivBytes.length);

        const valid = await crypto.subtle.verify('HMAC', hmacKey, macBytes, msg);
        if (!valid) return null;

        const aesKey = await crypto.subtle.importKey('raw', aesKeyRaw, { name: 'AES-CBC' }, false, ['decrypt']);
        const plainBuf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: ivBytes }, aesKey, ctBytes);
        return new TextDecoder('utf-8').decode(plainBuf);
      }

      function renderUnlockedHtml(html) {
        try { sessionStorage.setItem('kcar_ebiz_active_salt', SALT_B64); } catch (_) {}
        setTimeout(function () {
          document.open();
          document.write(html);
          document.close();
          window.scrollTo(0, 0);
        }, 0);
      }

      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

      const saltBytes = b64ToBytes(SALT_B64);
      const ivBytes = b64ToBytes(IV_B64);
      const macBytes = b64ToBytes(MAC_B64);
      const ctBytes = b64ToBytes(document.getElementById('encPayload').textContent);

      // 1. 동일 브라우저 탭 세션 내 자동 잠금 해제 (서브페이지 이동 시 재입력 불필요)
      (async function checkSessionUnlock() {
        try {
          const cached = sessionStorage.getItem(SESSION_KEY);
          if (cached) {
            const key64 = b64ToBytes(cached);
            const html = await tryDecryptWithKeyBytes(key64, ivBytes, macBytes, ctBytes);
            if (html !== null) {
              renderUnlockedHtml(html);
              return;
            }
            sessionStorage.removeItem(SESSION_KEY);
          }
        } catch (_) {}
        document.body.classList.remove('auto-unlocking');
        const input = document.getElementById('pwInput');
        if (input) input.focus();
      })();

      // 2. 비밀번호 눈 아이콘 토글
      document.getElementById('toggleEye').addEventListener('click', function () {
        const inp = document.getElementById('pwInput');
        inp.type = inp.type === 'password' ? 'text' : 'password';
        inp.focus();
      });

      // 3. 비밀번호 제출 및 복호화
      document.getElementById('unlockForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const inp = document.getElementById('pwInput');
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('errMsg');
        const card = document.getElementById('gateCard');
        const rawPw = inp.value.trim();
        if (!rawPw) return;

        btn.disabled = true;
        btn.textContent = '인증 확인 중...';
        err.textContent = '';

        try {
          const candidates = rawPw !== rawPw.toLowerCase() ? [rawPw, rawPw.toLowerCase()] : [rawPw];
          for (let i = 0; i < candidates.length; i++) {
            const key64 = await derive64Bytes(candidates[i], saltBytes);
            const html = await tryDecryptWithKeyBytes(key64, ivBytes, macBytes, ctBytes);
            if (html !== null) {
              try { sessionStorage.setItem(SESSION_KEY, bytesToB64(key64)); } catch (_) {}
              renderUnlockedHtml(html);
              return;
            }
          }
        } catch (_) {}

        btn.disabled = false;
        btn.textContent = '잠금 해제 →';
        err.textContent = '비밀번호가 일치하지 않습니다.';
        card.classList.remove('shake');
        void card.offsetWidth;
        card.classList.add('shake');
        inp.select();
      });
    })();
  </script>
</body>
